name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="v$(node -p "require('./package.json').version")"
          fi

          # Normalize version to lowercase (handle uppercase V prefix)
          VERSION="$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')"

          # Create draft release if it doesn't exist, or get existing one
          gh release view "$VERSION" --json id 2>/dev/null || \
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file "release-notes/$VERSION.md" \
              --draft \
              --generate-notes
        shell: bash

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run electron:build -- -p always
        shell: bash

      - name: List release artifacts
        run: ls -la release/
        shell: bash

      - name: Upload specific assets (force overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          VERSION="$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')"

          echo "Target Version: $VERSION"

          # Only upload .exe, .dmg, and .AppImage
          for file in release/*.{exe,dmg,AppImage}; do
            # Skip if no matches found
            [ -e "$file" ] || continue
            
            filename=$(basename "$file")
            echo "Processing: $filename"
            
            # Delete if exists to avoid duplication, then upload with clobber
            gh release delete-asset "$VERSION" "$filename" -y 2>/dev/null || true
            gh release upload "$VERSION" "$file" --clobber
          done
        shell: bash
