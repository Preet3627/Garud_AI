name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.3)'
        required: false
        default: ''

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="v$(node -p "require('./package.json').version")"
          fi

          # Create draft release if it doesn't exist, or get existing one
          gh release view "$VERSION" --json id 2>/dev/null || \
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file "release-notes/$(echo $VERSION | sed 's/^v//').md" \
              --draft \
              --generate-notes
        shell: bash

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run electron:build -- -p always
        shell: bash

      - name: Upload remaining assets (force overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"

          # Delete and re-upload each asset to handle existing releases
          for file in release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml release/latest.yml release/latest-linux.yml; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            gh release delete-asset "$VERSION" "$filename" 2>/dev/null || true
            gh release upload "$VERSION" "$file" --clobber
          done
        shell: bash
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest'