name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.4)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          VERSION="$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')"
          
          echo "Creating release for $VERSION"
          
          # Check if release exists
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file "release-notes/$VERSION.md" \
              --draft \
              --generate-notes
          fi
        shell: bash

  build-and-upload:
    needs: create-release
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run electron:build -- -p always
        shell: bash

      - name: List release artifacts
        run: ls -la release/
        shell: bash

      - name: Upload specific assets (force overwrite)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          VERSION="$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')"

          echo "Target Version: $VERSION"

          # Only upload .exe, .dmg, and .AppImage
          # Use shell globbing carefully across different OS
          for file in release/*.exe release/*.dmg release/*.AppImage; do
            [ -e "$file" ] || continue
            
            filename=$(basename "$file")
            echo "Processing: $filename"
            
            # Delete if exists to avoid duplication, then upload with clobber
            gh release delete-asset "$VERSION" "$filename" -y 2>/dev/null || true
            gh release upload "$VERSION" "$file" --clobber
          done
        shell: bash
